services:
  mariadb:
    image: mariadb:11.4
    container_name: tourpool-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tourpool
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./tourpool.sql:/docker-entrypoint-initdb.d/01-tourpool.sql:ro

  api:
    image: node:22-alpine
    container_name: tourpool-api
    working_dir: /app
    depends_on:
      - mariadb
    environment:
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: tourpool
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"

volumes:
  mariadb_data: